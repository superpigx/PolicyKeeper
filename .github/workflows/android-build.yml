name: 构建 APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

# 发布 Release 需要写权限
permissions:
  contents: write

jobs:
  # ==================== 每次提交都编译，第一时间发现编译错误 ====================
  build:
    name: 编译 Debug 包
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译
        run: ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: policykeeper-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

  # ==================== 推 v1.6 这样的 tag 时，自动打包并发布 ====================
  release:
    name: 发布 Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      # 签名密钥不入库，改由仓库 Secrets 提供，用法见 README
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::缺少 Secrets.KEYSTORE_BASE64，无法生成可安装的正式包。请在仓库 Settings → Secrets and variables → Actions 中配置后再重试。"
            exit 1
          fi
          mkdir -p keystore
          echo "$KEYSTORE_BASE64" | base64 -d > keystore/policykeeper.jks
          cat > keystore.properties <<EOF
          storeFile=keystore/policykeeper.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: 赋予 gradlew 执行权限
        run: chmod +x ./gradlew

      - name: 编译 Release 包
        run: ./gradlew assembleRelease --no-daemon

      - name: 重命名安装包
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/policykeeper-${{ github.ref_name }}.apk"

      - name: 发布到 Releases
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
